<!-- Patient Modal -->
<div class="modal-overlay" id="patientModal">
    <div class="modal">
        <h3 id="patientModalTitle">Add Patient</h3>
        <input type="hidden" id="patientIdField">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="patientName" placeholder="Patient's full name">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="patientEmail" placeholder="Email address">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="patientPassword" placeholder="Account password">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="patientPhone" placeholder="Phone number">
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" id="patientAge" placeholder="Age">
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select id="patientGender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" id="patientAddress" placeholder="Address">
        </div>
        <div class="form-actions">
            <button class="btn btn-danger" onclick="closeModal('patientModal')">Cancel</button>
            <button class="btn btn-success" onclick="savePatient()">Save</button>
        </div>
    </div>
</div>
