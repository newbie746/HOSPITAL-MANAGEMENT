<!-- ========== LOGIN PAGE ========== -->
<div class="login-container" id="loginPage">
    <div class="login-bg-shapes"></div>
    <div class="login-box">
        <div class="login-icon"><i class="fas fa-hospital"></i></div>
        <h1>HMS</h1>
        <p class="subtitle">Hospital Management System</p>
        <div id="loginAlert"></div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>
        <button class="btn btn-primary" onclick="login()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        <div class="login-links">
            Don't have an account? <a onclick="showRegister()">Register here</a>
        </div>
        <div style="margin-top:16px;padding:14px;background:#f0f2f5;border-radius:8px;font-size:12px;color:#666;">
            <strong>Default Admin:</strong> admin@hms.com / admin123
        </div>
    </div>
</div>

<!-- ========== REGISTER PAGE ========== -->
<div class="register-container" id="registerPage">
    <div class="login-bg-shapes"></div>
    <div class="login-box">
        <div class="login-icon"><i class="fas fa-user-plus"></i></div>
        <h1>Register</h1>
        <p class="subtitle">Create your account</p>
        <div id="registerAlert"></div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter full name">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Enter password">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="regRole">
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
            </select>
        </div>
        <div class="form-group" id="regSpecializationGroup" style="display:none;">
            <label>Specialization</label>
            <input type="text" id="regSpecialization" placeholder="e.g. Cardiology">
        </div>
        <div class="form-group" id="regPhoneGroup">
            <label>Phone</label>
            <input type="text" id="regPhone" placeholder="Phone number">
        </div>
        <button class="btn btn-primary" onclick="register()"><i class="fas fa-user-check"></i> Create Account</button>
        <div class="login-links">
            Already have an account? <a onclick="showLogin()">Sign in</a>
        </div>
    </div>
</div>
